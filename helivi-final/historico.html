              this.nextElementSibling.style.display = 'flex';

    <div class="main">
      <header class="topbar">
        <button class="topbar-menu" id="topbarMenu">
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"

            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <div class="topbar-info">
          <div class="topbar-title">Histórico</div>
        </div>
        <div class="topbar-user">
          <div class="topbar-avatar" id="topbarAvatar">?</div>
          <span class="topbar-name" id="topbarName"></span>
          <span
            class="badge b-org"
            id="topbarPerfilBadge"
            style="display: none; font-size: 10px"
          ></span>
        </div>
      </header>
      <div class="page-wrap">
        <div
          style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px"
        >
          <button class="filt-btn on" data-f="hoje">Hoje</button>
          <button class="filt-btn" data-f="semana">7 dias</button>
          <button class="filt-btn" data-f="mes">Este mês</button>
          <button class="filt-btn" data-f="tudo">Tudo</button>
        </div>
        <div class="stats-grid" style="margin-bottom: 22px">
          <div class="stat-box">
            <div class="sb-ic">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
              >
                <line x1="12" y1="1" x2="12" y2="23" />
                <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" />
              </svg>
            </div>
            <div class="sb-lbl">Total Vendido</div>
            <div class="sb-val" id="rTotal">—</div>
          </div>
          <div class="stat-box blu">
            <div class="sb-ic">
              <svg
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
              >
                <polyline points="6 9 6 2 18 2 18 9" />
                <path
                  d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"
                />
                <rect x="6" y="14" width="12" height="8" />
              </svg>
            </div>
            <div class="sb-lbl">Vendas</div>
            <div class="sb-val" id="rQtd">—</div>
          </div>
          <div class="stat-box amb">
            <div class="sb-ic">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
              >
                <path
                  d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"
                />
                <line x1="7" y1="7" x2="7.01" y2="7" />
              </svg>
            </div>
            <div class="sb-lbl">Ticket Médio</div>
            <div class="sb-val" id="rTicket">—</div>
          </div>
        </div>
        <div id="listaHist">
          <div class="loading-box">
            <div class="spin-d"></div>
            <span>Carregando...</span>
          </div>
        </div>
      </div>
    </div>
    <div class="overlay" id="modalDet">
      <div class="modal-box">
        <div class="modal-head">
          <span class="modal-title">Detalhes do Pedido</span
          ><button class="modal-close" onclick="closeModal('modalDet')">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div id="detBody"></div>
        <div style="margin-top: 16px">
          <button class="btn btn-ghost btn-full" id="btnDetImprimir">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"

              />
              <rect x="6" y="14" width="12" height="8" />
            </svg>
            Reimprimir
          </button>
